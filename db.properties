db.url=jdbc:mysql://localhost:3306/bantau?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8

# XAMPP mac dinh: user root, mat khau de trong.
# Neu ban da dat mat khau cho root thi dien vao dong db.password.
db.user=root
db.password=
